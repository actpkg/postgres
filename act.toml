[std]
name = "postgres"

[std.capabilities."wasi:sockets"]
description = "TCP connection to a PostgreSQL server."

# host "*" => any host; bounded to the common PostgreSQL ports: 5432 (default),
# 5433/5434 (additional local instances), 6432 (PgBouncer). A concrete port ceiling
# is more in keeping with ACT's capability model than "any port"; extend the list
# via a `--grant` override if a deployment needs a non-standard port.
[[std.capabilities."wasi:sockets".allow]]
host = "*"
ports = [5432, 5433, 5434, 6432]
protocols = ["tcp"]

# Semantic operation tiers. Enforced in-component today (self-checked against the
# session `mode`); host-enforced once the act:consent WIT lands. Declaring them
# sets the forward-looking ceiling so `--grant`/`--deny db:drop` is meaningful.
[std.capabilities."db:read"]
description = "Read data (SELECT, EXPLAIN, SHOW, schema introspection)."

[std.capabilities."db:write"]
description = "Modify rows (INSERT, UPDATE, DELETE, MERGE, COPY ... FROM)."

[std.capabilities."db:ddl"]
description = "Change schema (CREATE, ALTER, GRANT, REVOKE, ...)."

[std.capabilities."db:drop"]
description = "Destructive operations (DROP, TRUNCATE)."

# Bare table: the class takes no parameters. An undeclared class is always
# denied and no grant can widen it, so without this the component cannot reach
# the credential store however it is run.
[std.capabilities."act:credentials"]

# Declared so `act login <ref>` prompts for the role and its password with zero
# arguments. The field names live in this component's own namespace — a `std:`
# key is refused at pack time, and ACT-CONSTANTS §8.2 registers field *types*,
# not names.
[[std.credentials]]
# `default` is `DEFAULT_CREDENTIAL_KEY` in src/creds.rs — the key a session uses
# when its args do not name one.
key = "default"
description = "PostgreSQL role and password"

[[std.credentials.fields]]
key = "postgres:password"
label = "PostgreSQL password"

# Optional and not secret: a role name is not credential material, and a
# deployment may prefer to name the role in the session's `user` argument
# instead. Storing it beside the password keeps a role and its password
# together, which is how they are rotated.
[[std.credentials.fields]]
key = "postgres:user"
label = "PostgreSQL role"
secret = false
required = false
