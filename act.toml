[std]
name = "postgres"

[std.capabilities."wasi:sockets"]
description = "TCP connection to a PostgreSQL server."

# host "*" => any host; bounded to the common PostgreSQL ports: 5432 (default),
# 5433/5434 (additional local instances), 6432 (PgBouncer). A concrete port ceiling
# is more in keeping with ACT's capability model than "any port"; extend the list
# via a `--grant` override if a deployment needs a non-standard port.
[[std.capabilities."wasi:sockets".allow]]
host = "*"
ports = [5432, 5433, 5434, 6432]
protocols = ["tcp"]

# Semantic operation tiers. Enforced in-component today (self-checked against the
# session `mode`); host-enforced once the act:consent WIT lands. Declaring them
# sets the forward-looking ceiling so `--grant`/`--deny db:drop` is meaningful.
[std.capabilities."db:read"]
description = "Read data (SELECT, EXPLAIN, SHOW, schema introspection)."

[std.capabilities."db:write"]
description = "Modify rows (INSERT, UPDATE, DELETE, MERGE, COPY ... FROM)."

[std.capabilities."db:ddl"]
description = "Change schema (CREATE, ALTER, GRANT, REVOKE, ...)."

[std.capabilities."db:drop"]
description = "Destructive operations (DROP, TRUNCATE)."
